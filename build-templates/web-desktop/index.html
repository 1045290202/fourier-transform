<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">

    <title>傅里叶变换可视化</title>

    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover"/>
    <meta name="renderer" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='9' fill='none' stroke='%234ea1ff' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%23ffb454'/%3E%3C/svg%3E"/>
  </head>
  <body>
    <!-- 引擎按 id 取用这三层节点，名称与层级不可改；cc_exact_fit_screen=true 表示画面铺满窗口，
         不再由模板写死 width/height。若要固定尺寸窗口，改成 false 并给 #GameDiv 设具体宽高。 -->
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="720" tabindex="99"></canvas>
      </div>
    </div>

    <div id="BootMask">
      <div class="boot-spinner"></div>
      <p class="boot-text">正在初始化渲染器…</p>
    </div>

    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    (function () {
      var canvas = document.getElementById('GameCanvas');
      var mask = document.getElementById('BootMask');

      function removeMask() {
        if (!mask || !mask.parentNode) { return; }
        mask.classList.add('boot-hide');
        var node = mask;
        mask = null;
        setTimeout(function () {
          if (node.parentNode) { node.parentNode.removeChild(node); }
        }, 500);
      }

      // 引擎就绪的标志：它已拿到该 canvas 的 WebGL 上下文。对已创建的上下文再取一次
      // 返回的是同一个对象，不会额外占用，也不依赖能否覆盖 application.js。
      function engineReady() {
        try {
          return !!(canvas.getContext('webgl2') || canvas.getContext('webgl'));
        } catch (e) {
          return false;
        }
      }

      var timer = setInterval(function () {
        if (engineReady()) {
          clearInterval(timer);
          requestAnimationFrame(function () { requestAnimationFrame(removeMask); });
        }
      }, 120);

      // 兜底：引导链失败时不让遮罩永久盖住报错信息。
      setTimeout(function () { clearInterval(timer); removeMask(); }, 20000);
    })();

    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
